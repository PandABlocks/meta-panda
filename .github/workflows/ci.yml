name: CI

# Single entry point for this repo's GitHub Actions CI: the versioned MyST docs
# build + publish, and the Yocto boot build + release. Each substantial job is a
# reusable `_*.yml` workflow so this file stays orchestration-only; make/kas are
# the runners. There is no Python package here (meta-panda is a Yocto layer), so
# there is no pyproject/lint job.
#
# The two halves keep their original, different event sets via per-job `if:`
# guards over a union trigger, so consolidating did not change when anything runs:
#   docs (docs/publish)      — PRs, pushes to main, tags
#   boot (make_boot/release) — PRs, tags
# The release (on a tag) attaches the boot images plus the docs.zip artifact, so
# there is no separate docs-release step. The `docs` and `rel-*` branches are
# gone (docs merged into main; releases are tag-only now), so main + tags is the
# only trigger surface.
#
# Docs detail: the build (`_docs.yml`) runs for PRs (including forks) and uploads
# each build's `docs` artifact; publishing is nested here (the `publish` job) so
# its status shows on the PR/commit, but ONLY for internal events on this repo —
# a fork PR's build runs with a read-only token and must never deploy.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']            # '*' never matches '/'

jobs:
  # --- Docs (PRs, main pushes, tags) -------------------------------------------
  docs:
    uses: ./.github/workflows/_docs.yml

  # Internal events only: an internal PR, or a push to main/tag, has a
  # same-repo build we can trust + deploy. Fork PRs (head repo != this repo) are
  # excluded — _docs.yml's build job warns them instead.
  publish:
    needs: [docs]
    if: >-
      github.repository == 'PandABlocks/meta-panda' &&
      ( github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository )
    uses: ./.github/workflows/_publish.yml
    with:
      version-name: ${{ needs.docs.outputs.version-name }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      statuses: write

  # --- Yocto boot build (PRs, tags) --------------------------------------------
  make_boot:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        machine:
          - pandabox
          - pandabox2
          - pandabrick
    uses: ./.github/workflows/_make_boot.yml
    with:
      machine: ${{ matrix.machine }}

  # Tag-only: create the GitHub Release and attach the boot images plus this
  # build's docs.zip (the `docs` artifact) so `assemble` can reconstruct that
  # released version later.
  release:
    needs: [make_boot, docs]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write    # create the GitHub Release + attach assets
